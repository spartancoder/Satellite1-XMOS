[pytest]
# Pytest configuration for XMOS firmware testing

# Markers for test categorization
markers =
    xsim: Tests requiring xSIM simulation
    synthetic: Tests using synthetic audio data
    hardware: Tests requiring actual XMOS hardware
    slow: Tests that take longer than typical unit tests
    integration: Integration tests that exercise multiple components

# Test paths to discover
testpaths = synthetic xsim

# Python files to consider as tests
python_files = test_*.py

# Minimum Python version
minversion = 7.0

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage options (if pytest-cov is installed)
# addopts = --cov=src --cov-report=html --cov-report=term
